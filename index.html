<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekupera — Preparación física guiada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
/* ── TOKENS ── */
:root {
  --sand:     #F6F3EE;
  --sand2:    #EDE8E0;
  --sand3:    #DDD8CE;
  --white:    #FFFFFF;
  --ink:      #1A1815;
  --ink2:     #4A4742;
  --ink3:     #9A9690;
  --border:   rgba(0,0,0,0.07);
  --border2:  rgba(0,0,0,0.13);
  --rose:     #C8506A;
  --rose-l:   #F8EAED;
  --rose-d:   #9B3050;
  --purple:   #7C5CBF;
  --purple-l: #EDE8F8;
  --blue:     #2A7AB5;
  --blue-l:   #E4F0FA;
  --green:    #3A8A5A;
  --green-l:  #E2F4EA;
  --amber:    #D4783A;
  --amber-l:  #FAEEE4;
  --accent:   var(--rose);
  --accent-l: var(--rose-l);
  --r:        10px;
  --r2:       16px;
  --r3:       24px;
  --sidebar:  260px;
  --shadow:   0 2px 16px rgba(0,0,0,0.07);
  --shadow2:  0 4px 32px rgba(0,0,0,0.11);
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--sand);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── AUTH PAGES ── */
.auth-page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
@media(max-width:768px){ .auth-page{ grid-template-columns:1fr; } }

.auth-brand {
  background: linear-gradient(145deg, var(--rose-d), var(--rose));
  padding: 48px;
  display: flex; flex-direction: column; justify-content: center;
  position: relative; overflow: hidden;
}
.auth-brand::before {
  content: '';
  position: absolute; width: 400px; height: 400px;
  background: rgba(255,255,255,0.06); border-radius: 50%;
  top: -100px; right: -100px;
}
.auth-brand::after {
  content: '';
  position: absolute; width: 200px; height: 200px;
  background: rgba(255,255,255,0.04); border-radius: 50%;
  bottom: -50px; left: -50px;
}
.brand-logo {
  display: flex; align-items: center; gap: 12px; margin-bottom: 48px;
}
.brand-icon {
  width: 48px; height: 48px; border-radius: 14px;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
}
.brand-icon i { font-size: 24px; color: #fff; }
.brand-name { font-family: 'Fraunces', serif; font-size: 28px; color: #fff; }
.auth-headline {
  font-family: 'Fraunces', serif;
  font-size: 42px; font-weight: 800;
  color: #fff; line-height: 1.15;
  letter-spacing: -1px; margin-bottom: 20px;
}
.auth-sub { font-size: 16px; color: rgba(255,255,255,0.7); line-height: 1.6; max-width: 380px; }
.auth-programs {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 40px;
}
.auth-prog-pill {
  background: rgba(255,255,255,0.15);
  border-radius: 20px; padding: 7px 14px;
  font-size: 13px; color: rgba(255,255,255,0.85); font-weight: 500;
}
@media(max-width:768px){ .auth-brand{ padding:32px; } .auth-headline{ font-size:28px; } }

.auth-form-side {
  background: var(--white);
  padding: 48px;
  display: flex; flex-direction: column; justify-content: center;
  align-items: center;
}
.auth-form-wrap { width: 100%; max-width: 400px; }
.auth-form-title { font-family:'Fraunces',serif; font-size:28px; font-weight:800; color:var(--ink); margin-bottom:8px; }
.auth-form-sub { font-size:14px; color:var(--ink3); margin-bottom:32px; }
.form-group { margin-bottom:18px; }
.form-label { display:block; font-size:12px; font-weight:600; color:var(--ink2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:7px; }
.form-input {
  width:100%; padding:13px 16px;
  border:1.5px solid var(--border2); border-radius:var(--r);
  font-size:15px; color:var(--ink); background:var(--sand);
  outline:none; font-family:inherit; transition:border-color .15s;
}
.form-input:focus { border-color:var(--accent); background:var(--white); }
.btn-primary {
  width:100%; padding:14px; border-radius:var(--r2);
  background:var(--accent); color:#fff; border:none;
  font-size:15px; font-weight:700; cursor:pointer;
  font-family:inherit; display:flex; align-items:center;
  justify-content:center; gap:8px; transition:opacity .15s;
}
.btn-primary:hover { opacity:.9; }
.auth-switch { text-align:center; margin-top:20px; font-size:14px; color:var(--ink3); }
.auth-switch a { color:var(--accent); font-weight:600; cursor:pointer; text-decoration:none; }
.auth-divider { text-align:center; font-size:13px; color:var(--ink3); margin:12px 0; }

/* ── PROGRAM SELECTOR ── */
.prog-selector-page {
  min-height: 100vh;
  background: var(--sand);
  padding: 40px 24px;
  display: flex; flex-direction: column; align-items: center;
}
.prog-selector-header { text-align:center; max-width:560px; margin-bottom:40px; }
.prog-selector-header h1 { font-family:'Fraunces',serif; font-size:36px; font-weight:800; color:var(--ink); margin-bottom:12px; letter-spacing:-.5px; }
.prog-selector-header p { font-size:16px; color:var(--ink2); line-height:1.6; }
.prog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px; width: 100%; max-width: 960px;
}
.prog-card {
  border-radius: var(--r3); overflow: hidden; cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  box-shadow: var(--shadow);
}
.prog-card:hover { transform: translateY(-4px); box-shadow: var(--shadow2); }
.prog-card-inner { padding: 28px 24px; display:flex; align-items:center; gap:16px; }
.prog-emoji { font-size:36px; flex-shrink:0; }
.prog-title { font-size:18px; font-weight:800; color:#fff; margin-bottom:4px; }
.prog-desc { font-size:13px; color:rgba(255,255,255,.75); line-height:1.5; }
.prog-arrow { margin-left:auto; font-size:22px; color:rgba(255,255,255,.5); flex-shrink:0; }

/* ── APP LAYOUT ── */
.app-layout {
  display: grid;
  grid-template-columns: var(--sidebar) 1fr;
  min-height: 100vh;
}
@media(max-width:900px){
  .app-layout { grid-template-columns: 1fr; }
  .app-sidebar { display:none; }
  .app-sidebar.open { display:flex; position:fixed; inset:0; z-index:200; width:var(--sidebar); }
}

/* ── SIDEBAR ── */
.app-sidebar {
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}
.app-sidebar::-webkit-scrollbar { display:none; }
.sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.sidebar-logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.sidebar-logo-icon i { font-size: 18px; color: #fff; }
.sidebar-logo-text { font-family:'Fraunces',serif; font-size:20px; color:var(--ink); font-weight:700; }
.sidebar-nav { flex:1; padding:14px 10px; }
.nav-section-label {
  font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:.8px; color:var(--ink3);
  padding:12px 10px 6px;
}
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:var(--r);
  border:none; background:transparent; cursor:pointer;
  font-size:14px; color:var(--ink2); font-family:inherit;
  width:100%; text-align:left; transition:all .12s;
  position:relative;
}
.nav-item i { font-size:18px; flex-shrink:0; }
.nav-item:hover { background:var(--sand); color:var(--ink); }
.nav-item.active { background:var(--accent-l); color:var(--accent); font-weight:600; }
.nav-item.active i { color:var(--accent); }
.nav-badge {
  margin-left:auto; background:var(--accent); color:#fff;
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px;
}
.sidebar-user {
  padding:16px 16px 20px;
  border-top:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
  flex-shrink:0;
}
.user-avatar {
  width:36px; height:36px; border-radius:50%;
  background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; flex-shrink:0;
}
.user-name { font-size:14px; font-weight:600; color:var(--ink); }
.user-plan { font-size:12px; color:var(--ink3); }
.logout-btn {
  margin-left:auto; background:none; border:none; cursor:pointer;
  color:var(--ink3); font-size:16px; padding:4px;
}
.logout-btn:hover { color:var(--rose); }

/* ── TOPBAR ── */
.app-topbar {
  background:var(--white); border-bottom:1px solid var(--border);
  padding:16px 28px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
}
.topbar-title { font-size:18px; font-weight:700; color:var(--ink); }
.topbar-sub { font-size:13px; color:var(--ink3); margin-top:2px; }
.topbar-actions { display:flex; gap:10px; align-items:center; }
.btn-sm {
  padding:8px 16px; border-radius:var(--r); border:none;
  font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  display:inline-flex; align-items:center; gap:6px;
}
.btn-accent { background:var(--accent); color:#fff; }
.btn-outline { background:transparent; border:1.5px solid var(--border2); color:var(--ink2); }
.mobile-menu-btn {
  display:none; background:none; border:none; cursor:pointer;
  font-size:22px; color:var(--ink2);
}
@media(max-width:900px){ .mobile-menu-btn{ display:flex; } }

/* ── MAIN CONTENT ── */
.app-main { display:flex; flex-direction:column; min-width:0; }
.page-content { flex:1; padding:28px; }
@media(max-width:600px){ .page-content{ padding:16px; } }

/* ── GRID LAYOUTS ── */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media(max-width:900px){ .grid-4{ grid-template-columns:repeat(2,1fr); } .grid-3{ grid-template-columns:1fr 1fr; } }
@media(max-width:600px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }

/* ── CARDS ── */
.card {
  background:var(--white); border-radius:var(--r2);
  border:1px solid var(--border); padding:20px;
}
.card-title { font-size:14px; font-weight:700; color:var(--ink); margin-bottom:4px; }
.card-sub { font-size:12px; color:var(--ink3); }

/* ── STAT CARDS ── */
.stat-card { background:var(--white); border-radius:var(--r2); border:1px solid var(--border); padding:20px 22px; }
.stat-label { font-size:12px; color:var(--ink3); margin-bottom:8px; font-weight:500; }
.stat-value { font-size:28px; font-weight:800; color:var(--ink); line-height:1; font-family:'Fraunces',serif; }
.stat-delta { font-size:12px; margin-top:6px; font-weight:600; }
.delta-up { color:var(--green); }
.delta-accent { color:var(--accent); }

/* ── HERO BANNER ── */
.hero-banner {
  border-radius:var(--r3); padding:32px 36px;
  display:flex; align-items:center; justify-content:space-between;
  gap:24px; position:relative; overflow:hidden; margin-bottom:24px;
}
.hero-banner::before {
  content:''; position:absolute;
  width:300px; height:300px; border-radius:50%;
  background:rgba(255,255,255,0.07); top:-80px; right:-60px;
}
.hero-greeting { font-size:14px; color:rgba(255,255,255,.7); margin-bottom:6px; }
.hero-name { font-family:'Fraunces',serif; font-size:32px; font-weight:800; color:#fff; margin-bottom:6px; letter-spacing:-.5px; }
.hero-prog { font-size:14px; color:rgba(255,255,255,.7); }
.hero-ring { width:80px; height:80px; flex-shrink:0; }
@media(max-width:600px){ .hero-banner{ padding:24px; flex-direction:column; align-items:flex-start; } .hero-name{ font-size:24px; } }

/* ── WEEK STRIP ── */
.week-strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.week-strip::-webkit-scrollbar { display:none; }
.wday {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  min-width:48px; padding:10px 6px; border-radius:var(--r);
  flex-shrink:0; transition:all .12s;
}
.wday .wd { font-size:11px; color:var(--ink3); font-weight:600; }
.wday .wn { font-size:16px; font-weight:700; color:var(--ink2); }
.wday.done { background:var(--accent-l); }
.wday.done .wd,.wday.done .wn { color:var(--accent); }
.wday.today { background:var(--accent); }
.wday.today .wd,.wday.today .wn { color:#fff; }

/* ── SESSION CARD ── */
.session-card { background:var(--white); border-radius:var(--r2); border:1px solid var(--border); overflow:hidden; }
.session-card-header { padding:20px 22px; display:flex; gap:16px; align-items:flex-start; }
.session-icon {
  width:52px; height:52px; border-radius:var(--r);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; flex-shrink:0;
}
.session-title { font-size:16px; font-weight:700; color:var(--ink); }
.session-meta { font-size:13px; color:var(--ink3); margin-top:4px; }
.exercise-list { padding:0 22px 20px; display:flex; flex-direction:column; gap:8px; }
.exercise-row {
  background:var(--sand); border-radius:var(--r);
  padding:11px 14px; display:flex; align-items:center; gap:12px;
}
.ex-num {
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:800; flex-shrink:0;
}
.ex-name { font-size:14px; font-weight:500; color:var(--ink2); flex:1; }
.ex-sets { font-size:13px; color:var(--ink3); }

/* ── TAGS ── */
.tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:4px 10px; border-radius:20px;
  font-size:11px; font-weight:700;
}

/* ── PROGRESS PHOTOS ── */
.photo-compare { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.photo-slot {
  border-radius:var(--r2); aspect-ratio:3/4; overflow:hidden;
  position:relative; background:var(--sand2);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer;
}
.photo-slot img { width:100%; height:100%; object-fit:cover; }
.photo-slot-label {
  position:absolute; bottom:0; left:0; right:0;
  background:rgba(0,0,0,0.4); padding:8px 12px;
  font-size:12px; font-weight:700; color:#fff;
}
.photo-slot-week {
  position:absolute; top:10px; left:10px;
  background:rgba(0,0,0,0.4); padding:3px 9px;
  border-radius:10px; font-size:11px; font-weight:700; color:#fff;
}
.photo-empty { display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink3); }
.photo-empty i { font-size:32px; }
.photo-empty span { font-size:13px; font-weight:600; text-align:center; padding:0 12px; }

/* ── MEASURE ROWS ── */
.measure-item {
  padding:14px 20px; border-top:1px solid var(--border);
  display:flex; align-items:center; gap:14px;
}
.measure-ico {
  width:38px; height:38px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
}
.measure-name { font-size:14px; color:var(--ink2); flex:1; }
.measure-val { font-size:18px; font-weight:800; color:var(--ink); }
.measure-delta { font-size:12px; font-weight:600; margin-top:2px; }

/* ── VIDEO GRID ── */
.video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
.video-card {
  background:var(--white); border-radius:var(--r2);
  border:1px solid var(--border); overflow:hidden;
  cursor:pointer; transition:box-shadow .15s, transform .15s;
}
.video-card:hover { box-shadow:var(--shadow2); transform:translateY(-2px); }
.video-thumb {
  height:160px; display:flex; align-items:center; justify-content:center;
  font-size:48px; position:relative; overflow:hidden;
}
.video-thumb video { width:100%; height:100%; object-fit:cover; }
.video-play-btn {
  position:absolute; inset:0; background:rgba(0,0,0,0.25);
  display:flex; align-items:center; justify-content:center;
}
.video-play-btn i { font-size:42px; color:#fff; }
.video-info { padding:14px 16px; }
.video-title { font-size:15px; font-weight:700; color:var(--ink); margin-bottom:6px; }
.video-meta { font-size:12px; color:var(--ink3); }

/* ── CHAT ── */
.chat-layout { display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 73px); gap:0; }
@media(max-width:900px){ .chat-layout{ grid-template-columns:1fr; } .chat-clients-panel{ display:none; } }
.chat-clients-panel {
  background:var(--white); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.chat-panel-header { padding:18px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
.chat-panel-header h3 { font-size:15px; font-weight:700; color:var(--ink); }
.client-list { flex:1; overflow-y:auto; }
.client-list::-webkit-scrollbar { display:none; }
.client-list-item {
  padding:14px 20px; display:flex; align-items:center; gap:12px;
  cursor:pointer; border-bottom:1px solid var(--border); transition:background .12s;
}
.client-list-item:hover { background:var(--sand); }
.client-list-item.active { background:var(--accent-l); }
.client-av {
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#fff; flex-shrink:0;
}
.client-av-name { font-size:14px; font-weight:600; color:var(--ink); }
.client-av-prog { font-size:12px; color:var(--ink3); margin-top:2px; }
.client-unread {
  margin-left:auto; width:20px; height:20px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:10px; font-weight:700;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.chat-main { display:flex; flex-direction:column; background:var(--sand); }
.chat-header {
  background:var(--white); border-bottom:1px solid var(--border);
  padding:14px 20px; display:flex; align-items:center; gap:12px;
  flex-shrink:0;
}
.chat-av-lg {
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; color:#fff; flex-shrink:0;
  position:relative;
}
.online-dot {
  width:12px; height:12px; background:#22C55E; border-radius:50%;
  border:2px solid var(--white); position:absolute; bottom:1px; right:1px;
}
.chat-header-name { font-size:15px; font-weight:700; color:var(--ink); }
.chat-header-status { font-size:12px; color:#22C55E; margin-top:2px; }
.messages-area {
  flex:1; overflow-y:auto; padding:20px;
  display:flex; flex-direction:column; gap:12px;
}
.messages-area::-webkit-scrollbar { display:none; }
.msg-wrap { display:flex; gap:8px; align-items:flex-end; max-width:70%; }
.msg-wrap.mine { align-self:flex-end; flex-direction:row-reverse; }
.msg-av3 {
  width:30px; height:30px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700;
}
.msg-bub {
  padding:11px 15px; border-radius:18px;
  font-size:14px; line-height:1.55;
}
.msg-wrap.vic .msg-bub { background:var(--white); color:var(--ink); border-bottom-left-radius:4px; box-shadow:var(--shadow); }
.msg-wrap.mine .msg-bub { background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.msg-time { font-size:11px; color:var(--ink3); margin-top:4px; padding:0 2px; }
.msg-wrap.mine .msg-time { text-align:right; }
.date-sep { text-align:center; font-size:12px; color:var(--ink3); font-weight:600; padding:6px 0; }
.chat-input-area {
  background:var(--white); border-top:1px solid var(--border);
  padding:14px 20px; display:flex; gap:10px; align-items:flex-end;
  flex-shrink:0;
}
.chat-input {
  flex:1; padding:11px 16px; border-radius:22px;
  border:1.5px solid var(--border2); background:var(--sand);
  font-size:14px; color:var(--ink); outline:none; font-family:inherit;

async function doLogin() {
  const email = tval('l-email'), pass = $('l-pass')?.value
  if (!email||!pass) return toast('Completa correo y contraseña')
  toast('Ingresando…')
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass })
  if (error) return toast('Error: ' + error.message)
  USER = data.user; await loadProfile()
}

async function doRegister() {
  const nom = tval('r-nom'), email = tval('r-email'), pass = $('r-pass')?.value
  if (!nom||!email||!pass) return toast('Completa todos los campos')
  if (pass.length < 6) return toast('La contraseña debe tener al menos 6 caracteres')
  toast('Creando cuenta…')
  const { data, error } = await sb.auth.signUp({ email, password:pass, options:{ data:{ full_name:nom } } })
  if (error) return toast('Error: ' + error.message)
  USER = data.user
  await sb.from('profiles').upsert({ id:USER.id, nombre:nom, email, programa:null, es_victoria:false })
  toast('¡Cuenta creada! Elige tu programa 🎉')
  renderPrograms()
}

async function doLogout() {
  await sb.auth.signOut(); USER=null; PROFILE=null; renderLogin()
}

function switchTab(id, skipAnim) {

  $('topbar-title').textContent = titles[id] || id
  const content = $('page-content')
  if (!content) return
  if (id==='home')     { renderHome(content); setTopbarActions([]) }
  if (id==='progreso') { renderProgreso(content); setTopbarActions([{label:'Registrar medidas', icon:'ti-plus', fn:'openModal("modal-med")'}]) }

async function loadMedidas() {
  if (!USER) return
  const p = PC[PROG]
  const { data } = await sb.from('medidas').select('*').eq('user_id', USER.id).order('created_at', { ascending:false }).limit(20)
  const list = $('medidas-list'); if (!list) return
  if (!data||data.length===0) { list.innerHTML='<div class="empty-state"><i class="ti ti-ruler"></i><p>Sin medidas registradas aún.<br>Empieza hoy para ver tu evolución.</p></div>'; return }
  const lat=data[0], first=data[data.length-1]
  const rows = [['ti-weight','Peso',lat.peso,first.peso,'kg'],['ti-circle','Cintura',lat.cintura,first.cintura,'cm'],['ti-circle-dotted','Cadera',lat.cadera,first.cadera,'cm'],['ti-minus','Muslo',lat.muslo,first.muslo,'cm']]
  list.innerHTML = rows.filter(r=>r[2]).map(([ico,nam,val,ini,u]) => {
    const diff = val&&ini ? (val-ini).toFixed(1) : null
    const isGood = diff && parseFloat(diff)<0
    return `<div class="measure-item">
      <div class="measure-ico" style="background:${p.al};color:${p.a};"><i class="ti ${ico}"></i></div>
      <span class="measure-name">${nam}</span>
      <div style="text-align:right;"><div class="measure-val">${val} ${u}</div>${diff?`<div class="measure-delta ${isGood?'delta-up':'delta-accent'}">${isGood?'↓':'↑'} ${Math.abs(diff)} ${u} desde el inicio</div>`:''}</div>
    </div>`
  }).join('')
  // Load photos
  const { data:fotos } = await sb.from('fotos_progreso').select('*').eq('user_id',USER.id).order('created_at',{ascending:true})
  if (fotos&&fotos.length>0) {
    const grid = $('photo-compare'); if(!grid) return
    const u1 = sb.storage.from('fotos-progreso').getPublicUrl(fotos[0].path).data.publicUrl
    const u2 = sb.storage.from('fotos-progreso').getPublicUrl(fotos[fotos.length-1].path).data.publicUrl
    grid.innerHTML = `<div class="photo-slot"><img src="${u1}"><div class="photo-slot-week">Inicio</div><div class="photo-slot-label">Antes</div></div><div class="photo-slot"><img src="${u2}"><div class="photo-slot-week">Hoy</div><div class="photo-slot-label">Ahora</div></div>`
  }
}

function previewFoto(inp) {
  const f = inp.files[0]; if(!f) return
  const r = new FileReader(); r.onload = e => { $('preview-img').src=e.target.result; $('preview-wrap').style.display='block' }; r.readAsDataURL(f)
}

async function guardarMedidas() {
  if (!USER) return toast('Debes estar logueada')
  const peso=parseFloat($('i-peso')?.value)||null, cin=parseFloat($('i-cintura')?.value)||null, cad=parseFloat($('i-cadera')?.value)||null, mus=parseFloat($('i-muslo')?.value)||null, foto=$('i-foto')?.files?.[0]
  const btn=$('btn-guardar'); if(btn){btn.innerHTML='<i class="ti ti-loader-2"></i> Guardando…';btn.disabled=true}
  const {error}=await sb.from('medidas').insert({user_id:USER.id,peso,cintura:cin,cadera:cad,muslo:mus})
  if(error){toast('Error: '+error.message);if(btn){btn.innerHTML='<i class="ti ti-device-floppy"></i> Guardar medidas';btn.disabled=false};return}
  if(foto){const ext=foto.name.split('.').pop(),path=`${USER.id}/${Date.now()}.${ext}`;const{error:ue}=await sb.storage.from('fotos-progreso').upload(path,foto);if(!ue)await sb.from('fotos_progreso').insert({user_id:USER.id,path})}
  closeModal('modal-med')
  if(btn){btn.innerHTML='<i class="ti ti-device-floppy"></i> Guardar medidas';btn.disabled=false}
  toast('Medidas guardadas ✓')
  setTimeout(loadMedidas,500)
}

  if(cat!=='todos') q=q.eq('categoria',cat)
  const {data,error}=await q
  if(error||!data||data.length===0){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;"><i class="ti ti-video-off"></i><p>No hay videos en esta categoría aún.<br>Victoria los irá subiendo.</p></div>';return}

  let q=sb.from('mensajes').select('*').order('created_at',{ascending:true}).limit(60)
  if(vicId) q=q.or(`and(de_id.eq.${USER.id},para_id.eq.${vicId}),and(de_id.eq.${vicId},para_id.eq.${USER.id})`)

  if(!data||data.length===0){msgs.innerHTML=`<div class="msg-wrap vic"><div class="msg-av3" style="background:var(--ink);color:#fff;">VC</div><div><div class="msg-bub">Hola 👋 Bienvenida a Rekupera. Estoy aquí para acompañarte. ¡Cualquier duda me escribes!</div><div class="msg-time">Victoria</div></div></div>`;return}
  const ini=initials(PROFILE?.nombre)
  msgs.innerHTML=data.map(m=>{const mine=m.de_id===USER.id;return `<div class="msg-wrap ${mine?'mine':'vic'}"><div class="msg-av3" style="background:${mine?'var(--accent)':'var(--ink)'};color:#fff;">${mine?ini:'VC'}</div><div><div class="msg-bub">${m.texto}</div><div class="msg-time">${fmtTime(m.created_at)}</div></div></div>`}).join('')
  msgs.scrollTop=msgs.scrollHeight
  if(chatSub){try{await sb.removeChannel(chatSub)}catch(e){}}
  chatSub=sb.channel('chat-c-'+USER.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes'},pl=>{
    const m=pl.new;if(m.de_id!==USER.id&&m.para_id!==USER.id)return
    const mine=m.de_id===USER.id
    const d=document.createElement('div');d.className='msg-wrap '+(mine?'mine':'vic')
    d.innerHTML=`<div class="msg-av3" style="background:${mine?'var(--accent)':'var(--ink)'};color:#fff;">${mine?ini:'VC'}</div><div><div class="msg-bub">${m.texto}</div><div class="msg-time">${fmtTime(m.created_at)}</div></div>`
    msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight
  }).subscribe()
}

function switchCoachTab(id) {

  const el=$('coach-topbar-actions');if(el)el.innerHTML=(actions[id]||[]).map(a=>`<button class="btn-sm btn-accent" onclick="${a.fn}"><i class="ti ${a.icon}"></i> ${a.label}</button>`).join('')
  const content=$('coach-content');if(!content)return

async function openCoachChat(clientId) {
  ACTIVE_CHAT=clientId
  document.querySelectorAll('.client-list-item').forEach(el=>el.classList.remove('active'))
  $(`cli-${clientId}`)?.classList.add('active')
  const client=ALL_CLIENTS.find(c=>c.id===clientId)
  const p=PC[client?.programa]||PC.peso
  const mainEl=$('coach-chat-main'); if(!mainEl)return
  mainEl.innerHTML=`
    <div class="chat-header">
      <div class="chat-av-lg" style="background:${p.a};">${initials(client?.nombre||client?.email)}</div>
      <div><div class="chat-header-name">${client?.nombre||client?.email}</div><div class="chat-header-status">${p.e} ${p.l}</div></div>
      <button class="btn-sm btn-accent" style="margin-left:auto;" onclick="openPlanFor('${clientId}','${(client?.nombre||'').replace(/'/g,"\\'")}')"><i class="ti ti-send"></i> Enviar plan</button>
      <button class="wa-btn" onclick="toast('Abriendo WhatsApp…')"><i class="ti ti-brand-whatsapp"></i></button>
    </div>
    <div class="messages-area" id="coach-msgs"><div class="loading-center"><div class="spinner"></div></div></div>
    <div class="chat-input-area">
      <input class="chat-input" id="coach-chat-inp" type="text" placeholder="Escribe a ${client?.nombre?.split(' ')[0]||'la clienta'}…" onkeydown="if(event.key==='Enter')sendCoachMsg('${clientId}')">
      <button class="chat-send" onclick="sendCoachMsg('${clientId}')"><i class="ti ti-send"></i></button>
    </div>`
  // Load messages
  const{data}=await sb.from('mensajes').select('*')
    .or(`and(de_id.eq.${USER.id},para_id.eq.${clientId}),and(de_id.eq.${clientId},para_id.eq.${USER.id})`)
    .order('created_at',{ascending:true}).limit(60)
  const msgs=$('coach-msgs'); if(!msgs)return
  if(!data||data.length===0){msgs.innerHTML=`<div class="empty-state"><i class="ti ti-message-circle"></i><p>Sin mensajes aún con ${client?.nombre?.split(' ')[0]||'esta clienta'}.</p></div>`;return}
  const cIni=initials(client?.nombre||client?.email)
  msgs.innerHTML=data.map(m=>{
    const mine=m.de_id===USER.id
    return `<div class="msg-wrap ${mine?'mine':'vic'}">
      <div class="msg-av3" style="background:${mine?'var(--ink)':''+p.a};color:#fff;">${mine?'VC':cIni}</div>
      <div><div class="msg-bub">${m.texto}</div><div class="msg-time">${fmtTime(m.created_at)}</div></div>
    </div>`
  }).join('')
  msgs.scrollTop=msgs.scrollHeight
  // Realtime
  if(chatSub){try{await sb.removeChannel(chatSub)}catch(e){}}
  chatSub=sb.channel('coach-chat-'+clientId).on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes'},pl=>{
    const m=pl.new; if(m.de_id!==clientId&&m.para_id!==clientId) return
    const mine=m.de_id===USER.id
    const d=document.createElement('div');d.className='msg-wrap '+(mine?'mine':'vic')
    d.innerHTML=`<div class="msg-av3" style="background:${mine?'var(--ink)':''+p.a};color:#fff;">${mine?'VC':cIni}</div><div><div class="msg-bub">${m.texto}</div><div class="msg-time">${fmtTime(m.created_at)}</div></div>`
    msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight
  }).subscribe()
}

async function sendCoachMsg(clientId) {
  const inp=$('coach-chat-inp'); const txt=inp?.value?.trim(); if(!txt) return; inp.value=''
  await sb.from('mensajes').insert({de_id:USER.id,para_id:clientId,texto:txt})
}

function openPlanFor(clientId, clientName) {
  const sel=$('plan-clienta'); if(sel) sel.value=clientId

async function enviarPlan() {
  const clientId=tval('plan-clienta')||$('plan-clienta')?.value
  const titulo=tval('plan-titulo'), semana=tval('plan-semana'), dur=tval('plan-duracion'), notas=tval('plan-notas')
  if(!clientId||!titulo) return toast('Selecciona clienta y escribe el título de la sesión')
  const rows=[...$('exercise-builder').querySelectorAll('.ex-builder-row')]
  const ejercicios=rows.map(row=>{const inps=row.querySelectorAll('input');return{nombre:inps[0]?.value?.trim(),series:inps[1]?.value?.trim(),reps:inps[2]?.value?.trim()}}).filter(e=>e.nombre)
  const texto=`📋 *Plan de sesión — Semana ${semana||'?'}*\n\n*${titulo}*\n${dur?'⏱ '+dur+'\n':''}\n${ejercicios.map((e,i)=>`${i+1}. ${e.nombre}${e.series?' — '+e.series:''}${e.reps?' × '+e.reps:''}`).join('\n')}${notas?'\n\n💬 '+notas:''}`
  const{error}=await sb.from('mensajes').insert({de_id:USER.id,para_id:clientId,texto})
  if(error) return toast('Error al enviar: '+error.message)
  closeModal('modal-plan')
  toast('Plan enviado a la clienta ✓')
  if(ACTIVE_CHAT===clientId) setTimeout(()=>openCoachChat(clientId),300)
}

async function loadCoachVideos() {

  if(!data||data.length===0){list.innerHTML='<div class="empty-state"><i class="ti ti-video-off"></i><p>Aún no has subido videos.</p></div>';return}
  list.innerHTML=data.map(v=>{const p=PC[v.categoria]||PC.peso;return `<div class="card" style="margin-bottom:10px;display:flex;align-items:center;gap:12px;padding:14px;"><div style="width:42px;height:42px;border-radius:var(--r);background:${p.al};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${p.e}</div><div style="flex:1;"><div style="font-size:14px;font-weight:600;color:var(--ink);">${v.titulo}</div><div style="font-size:12px;color:var(--ink3);margin-top:2px;">${p.l} · ${v.duracion||'—'} · ${v.nivel||'—'}</div></div></div>`}).join('')

async function subirVideo() {
  const tit=tval('vup-titulo'),cat=$('vup-cat')?.value,niv=$('vup-nivel')?.value,dur=tval('vup-dur'),desc=tval('vup-desc'),file=$('vup-file')?.files?.[0]
  if(!tit||!cat||!file)return toast('Completa título, programa y selecciona un video')
  const uprog=$('vup-prog'),ubar=$('vup-bar')
  if(uprog)uprog.style.display='block';if(ubar)ubar.style.width='15%'
  const ext=file.name.split('.').pop(),path=`${cat}/${Date.now()}.${ext}`
  const{error:ue}=await sb.storage.from('videos-ejercicios').upload(path,file)
  if(ue){toast('Error al subir: '+ue.message);return}
  if(ubar)ubar.style.width='80%'
  const{error:de}=await sb.from('videos').insert({titulo:tit,categoria:cat,duracion:dur,nivel:niv,descripcion:desc,storage_path:path})
  if(de){toast('Error al guardar: '+de.message);return}
  if(ubar)ubar.style.width='100%';setTimeout(()=>{if(uprog)uprog.style.display='none';if(ubar)ubar.style.width='0%'},1500)
  toast('¡Video subido exitosamente! ✓')
  closeModal('modal-video-up')
  loadCoachVideos()
}
