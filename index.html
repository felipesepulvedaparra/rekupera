<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rekupera</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
/* ── VARIABLES ── */
:root {
  --bg:#F5F3F0;--bg2:#FFFFFF;--bg3:#EEEBE6;
  --text:#1A1917;--text2:#5C5A56;--text3:#9B9893;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --accent:#C8506A;--accent-l:#F8E8EC;--accent-d:#9B3050;
  --r:12px;--r2:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#111;}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;}

/* ── PHONE SHELL ── */
.phone{width:393px;height:852px;border-radius:50px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  box-shadow:0 50px 100px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07);
  background:var(--bg);}
.status-bar{padding:14px 28px 8px;display:flex;justify-content:space-between;
  align-items:center;background:var(--bg2);flex-shrink:0;}
.st-time{font-size:15px;font-weight:700;color:var(--text);}
.st-icons{display:flex;gap:5px;align-items:center;}
.st-icons i{font-size:14px;color:var(--text);}

/* ── SCREENS ── */
.screens-wrap{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;background:var(--bg);
  display:none;flex-direction:column;}
.screen.active{display:flex;}
.screen::-webkit-scrollbar{display:none;}

/* ── BOTTOM NAV ── */
.bottom-nav{background:var(--bg2);padding:8px 6px 20px;display:flex;
  justify-content:space-around;border-top:1px solid var(--border);flex-shrink:0;}
.nav-t{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 14px;border-radius:12px;border:none;background:transparent;
  cursor:pointer;min-width:56px;transition:all .15s;}
.nav-t i{font-size:22px;color:var(--text3);}
.nav-t span{font-size:10px;color:var(--text3);font-weight:500;}
.nav-t.active i,.nav-t.active span{color:var(--accent);}
.nav-t.active{background:color-mix(in srgb,var(--accent) 10%,transparent);}

/* ── COMPONENTS ── */
.btn-main{background:var(--accent);color:#fff;border:none;border-radius:var(--r2);
  padding:15px;font-size:15px;font-weight:700;cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;}
.btn-main:active{opacity:.82;}
.card{background:var(--bg2);border-radius:var(--r2);overflow:hidden;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
  border-radius:20px;font-size:10.5px;font-weight:700;}
.section-lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--text3);padding:14px 20px 8px;}
.form-inp{width:100%;padding:13px 16px;border:1.5px solid var(--border2);
  border-radius:var(--r);font-size:15px;color:var(--text);background:var(--bg);
  outline:none;font-family:inherit;margin-bottom:10px;}
.form-inp:focus{border-color:var(--accent);}
.form-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px;display:block;}
.spinner{width:32px;height:32px;border:3px solid var(--bg3);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;color:var(--text3);font-size:13px;}
.empty-state{padding:32px 20px;display:flex;flex-direction:column;
  align-items:center;gap:10px;color:var(--text3);text-align:center;}
.empty-state i{font-size:36px;}

/* ── LOGIN ── */
#s-login{background:var(--bg2);align-items:center;justify-content:center;padding:32px 28px;}
.logo-icon{width:72px;height:72px;border-radius:22px;
  background:linear-gradient(145deg,#9B3050,#C8506A);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.logo-icon i{font-size:34px;color:#fff;}
.logo-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.6px;text-align:center;}
.logo-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:28px;}
.login-tabs{display:flex;gap:8px;margin-bottom:20px;}
.login-tab{flex:1;padding:10px;border-radius:var(--r);border:1.5px solid var(--border2);
  background:var(--bg);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;}
.login-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.link-btn{background:none;border:none;color:var(--accent);font-size:13px;
  font-weight:600;cursor:pointer;text-align:center;padding:8px;width:100%;}

/* ── PROGRAMS ── */
.prog-list{padding:14px 18px;display:flex;flex-direction:column;gap:12px;}
.prog-opt{border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:transform .15s;}
.prog-opt:active{transform:scale(.98);}
.prog-inner{padding:18px 20px;display:flex;align-items:center;gap:14px;}
.prog-icon{width:52px;height:52px;border-radius:var(--r);background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.prog-name{font-size:16px;font-weight:800;color:#fff;}
.prog-desc{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px;}

/* ── HOME HERO ── */
.hero{padding:22px 22px 26px;position:relative;overflow:hidden;flex-shrink:0;}
.hero::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.07);top:-40px;right:-30px;}
.hero-hi{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:4px;}
.hero-name{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px;}
.hero-prog{font-size:13px;color:rgba(255,255,255,.65);margin-top:3px;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;}
.hero-stat{background:rgba(255,255,255,.13);border-radius:var(--r);padding:12px 10px;text-align:center;}
.hero-stat-v{font-size:20px;font-weight:800;color:#fff;line-height:1;}
.hero-stat-l{font-size:10px;color:rgba(255,255,255,.6);margin-top:3px;}
.week-strip{display:flex;gap:6px;padding:14px 18px 0;overflow-x:auto;}
.week-strip::-webkit-scrollbar{display:none;}
.wday{display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:40px;padding:8px 6px;border-radius:var(--r);}
.wday .wd{font-size:10px;color:var(--text3);font-weight:600;}
.wday .wn{font-size:15px;font-weight:700;color:var(--text2);}
.wday.done{background:color-mix(in srgb,var(--accent) 12%,transparent);}
.wday.done .wd,.wday.done .wn{color:var(--accent);}
.wday.today{background:var(--accent);}
.wday.today .wd,.wday.today .wn{color:#fff;}

/* ── SESSION CARD ── */
.sess-card{margin:14px 18px 0;background:var(--bg2);border-radius:var(--r2);overflow:hidden;}
.sess-top{padding:16px 18px;display:flex;align-items:flex-start;gap:13px;}
.sess-icon{width:46px;height:46px;border-radius:var(--r);display:flex;
  align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.sess-title{font-size:15px;font-weight:700;color:var(--text);}
.sess-meta{font-size:12px;color:var(--text3);margin-top:3px;}
.sess-exs{padding:0 18px 16px;display:flex;flex-direction:column;gap:7px;}
.sess-ex{background:var(--bg);border-radius:var(--r);padding:10px 12px;
  display:flex;align-items:center;gap:10px;}
.sess-ex-n{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.sess-ex-name{font-size:13px;font-weight:500;color:var(--text2);flex:1;}
.sess-ex-sets{font-size:12px;color:var(--text3);}
.sess-btn{padding:0 18px 18px;}
.vic-pill{margin:12px 18px 0;background:var(--bg2);border-radius:var(--r2);
  padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.vic-av{width:42px;height:42px;border-radius:50%;background:#1A1917;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  font-weight:700;flex-shrink:0;position:relative;}
.vic-dot{width:11px;height:11px;background:#22C55E;border-radius:50%;
  border:2px solid var(--bg2);position:absolute;bottom:1px;right:1px;}

/* ── PROGRESS ── */
.screen-hdr{padding:20px 20px 16px;background:var(--bg2);border-bottom:1px solid var(--border);}
.screen-hdr h2{font-size:20px;font-weight:800;color:var(--text);}
.screen-hdr p{font-size:13px;color:var(--text3);margin-top:2px;}
.photo-grid{padding:14px 18px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.photo-slot{border-radius:var(--r);aspect-ratio:3/4;overflow:hidden;position:relative;
  background:var(--bg3);display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;}
.photo-slot img{width:100%;height:100%;object-fit:cover;}
.photo-slot-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.42);
  padding:6px 10px;font-size:11px;font-weight:700;color:#fff;}
.photo-slot-week{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.42);
  padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;}
.measures-block{margin:12px 18px 0;background:var(--bg2);border-radius:var(--r2);overflow:hidden;}
.mb-hdr{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;}
.mb-title{font-size:14px;font-weight:700;color:var(--text);}
.mb-add{background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);}
.measure-row{padding:12px 18px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:12px;}
.measure-ico{width:34px;height:34px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.measure-name{font-size:13px;color:var(--text2);flex:1;}
.measure-val{font-size:16px;font-weight:800;color:var(--text);}
.measure-delta{font-size:11px;font-weight:700;}
.delta-pos{color:#3A8A5A;}
.delta-neg{color:#C8506A;}

/* ── VIDEOS ── */
.vf-strip{display:flex;gap:6px;padding:12px 18px;overflow-x:auto;}
.vf-strip::-webkit-scrollbar{display:none;}
.vf-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border2);
  background:var(--bg2);font-size:12px;font-weight:600;color:var(--text2);
  cursor:pointer;white-space:nowrap;flex-shrink:0;}
.vf-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.video-list{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;}
.video-card{background:var(--bg2);border-radius:var(--r2);display:flex;
  align-items:center;cursor:pointer;overflow:hidden;transition:opacity .15s;}
.video-card:active{opacity:.85;}
.video-thumb{width:96px;height:70px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:26px;position:relative;}
.video-play{position:absolute;inset:0;background:rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;}
.video-play i{font-size:22px;color:#fff;}
.video-info{flex:1;padding:11px 14px;}
.video-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;}
.video-meta{font-size:11px;color:var(--text3);}

/* ── CHAT ── */
#s-chat{flex-direction:column;}
.chat-hdr{background:var(--bg2);padding:14px 18px;display:flex;align-items:center;
  gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-av{width:42px;height:42px;border-radius:50%;background:#1A1917;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  font-weight:700;flex-shrink:0;position:relative;}
.chat-online{width:11px;height:11px;background:#22C55E;border-radius:50%;
  border:2px solid var(--bg2);position:absolute;bottom:1px;right:1px;}
.chat-wa{margin-left:auto;background:#25D366;color:#fff;border:none;
  border-radius:var(--r);padding:8px 12px;font-size:12px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;background:var(--bg);}
.msgs::-webkit-scrollbar{display:none;}
.msg-row{display:flex;gap:7px;align-items:flex-end;max-width:82%;}
.msg-row.me{flex-direction:row-reverse;align-self:flex-end;}
.msg-av2{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.msg-av2.vic{background:#1A1917;color:#fff;}
.msg-av2.me{background:var(--bg3);color:var(--text2);}
.bub{padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.55;}
.msg-row.vic .bub{background:var(--bg2);color:var(--text);border-bottom-left-radius:4px;}
.msg-row.me .bub{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.msg-t{font-size:10px;color:var(--text3);margin-top:3px;}
.msg-row.me .msg-t{text-align:right;}
.qchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:var(--bg);}
.qchip{background:var(--bg2);border:1.5px solid var(--border2);border-radius:16px;
  padding:7px 12px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;}
.chat-inp-row{background:var(--bg2);padding:10px 14px 12px;display:flex;gap:8px;
  align-items:center;border-top:1px solid var(--border);flex-shrink:0;}
.chat-inp{flex:1;padding:10px 14px;border-radius:22px;border:1.5px solid var(--border2);
  background:var(--bg);font-size:14px;color:var(--text);outline:none;}
.chat-inp:focus{border-color:var(--accent);}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);
  border:none;color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;}

/* ── COACH ── */
#s-coach{background:#0F0E0D;}
.coach-hdr{background:#0F0E0D;padding:20px 22px 16px;
  display:flex;align-items:center;justify-content:space-between;}
.coach-hdr h2{font-size:22px;font-weight:800;color:#fff;}
.coach-hdr p{font-size:13px;color:rgba(255,255,255,.4);margin-top:2px;}
.coach-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 16px;}
.cs-card{background:rgba(255,255,255,.06);border-radius:var(--r);padding:14px;text-align:center;}
.cs-val{font-size:22px;font-weight:800;color:#fff;}
.cs-lbl{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px;}
.coach-lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:rgba(255,255,255,.3);padding:14px 18px 8px;}
.clients-list{padding:0 18px 14px;display:flex;flex-direction:column;gap:10px;}
.client-card{border-radius:var(--r2);overflow:hidden;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);}
.cc-top{padding:14px 16px;display:flex;align-items:center;gap:12px;}
.cc-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.cc-name{font-size:14px;font-weight:700;color:#fff;}
.cc-prog{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px;}
.cc-foot{padding:8px 16px 14px;border-top:1px solid rgba(255,255,255,.06);
  display:flex;gap:16px;}
.cc-m-val{font-size:14px;font-weight:700;color:#fff;}
.cc-m-lbl{font-size:10px;color:rgba(255,255,255,.35);}
.upload-section{padding:0 18px 24px;display:flex;flex-direction:column;gap:10px;}
.dark-inp{width:100%;padding:12px 14px;border:1.5px solid rgba(255,255,255,.12);
  border-radius:var(--r);font-size:14px;color:#fff;background:rgba(255,255,255,.06);
  outline:none;font-family:inherit;}
.dark-inp:focus{border-color:#C8506A;}
.upload-area{border:2px dashed rgba(255,255,255,.15);border-radius:var(--r2);
  padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;background:rgba(255,255,255,.03);}
.upload-area i{font-size:30px;color:#C8506A;}
.upload-area p{font-size:13px;color:rgba(255,255,255,.4);text-align:center;}
.uprog-wrap{width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;display:none;}
.uprog-bar{height:100%;background:#C8506A;border-radius:3px;transition:width .3s;}

/* ── MODAL ── */
.modal-ov{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:none;align-items:flex-end;}
.modal-ov.open{display:flex;}
.modal-sh{background:var(--bg2);width:100%;border-radius:28px 28px 0 0;
  padding:0 0 28px;animation:su .3s ease;max-height:92%;}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hnd{width:38px;height:4px;background:var(--bg3);border-radius:2px;margin:12px auto 18px;}
.modal-tit{font-size:18px;font-weight:800;color:var(--text);padding:0 22px 16px;}
.modal-bd{padding:0 22px;display:flex;flex-direction:column;gap:12px;
  overflow-y:auto;max-height:55vh;}
.modal-bd::-webkit-scrollbar{display:none;}
.m-inp{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r);
  font-size:16px;font-weight:700;color:var(--text);background:var(--bg);outline:none;font-family:inherit;}
.m-inp:focus{border-color:var(--accent);}
.modal-save{margin:18px 22px 0;background:var(--accent);color:#fff;border:none;
  border-radius:var(--r2);padding:15px;font-size:16px;font-weight:700;cursor:pointer;
  width:calc(100% - 44px);display:flex;align-items:center;justify-content:center;gap:8px;}
.photo-upload-lbl{display:flex;align-items:center;gap:8px;padding:11px 14px;
  border:1.5px dashed var(--border2);border-radius:var(--r);cursor:pointer;
  font-size:14px;color:var(--text2);background:var(--bg);}
#preview-wrap{display:none;margin-top:8px;border-radius:12px;overflow:hidden;}
#preview-wrap img{width:100%;border-radius:12px;}

/* ── VIDEO MODAL ── */
#modal-video .modal-sh{height:80%;}
.video-modal-inner{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px;
  height:calc(100% - 40px);}
#vm-title{font-size:18px;font-weight:800;color:var(--text);}
#vm-player{width:100%;border-radius:14px;background:#000;flex-shrink:0;max-height:220px;}
#vm-desc{font-size:14px;color:var(--text2);line-height:1.6;overflow-y:auto;}

/* ── TOAST ── */
.toast{position:absolute;bottom:88px;left:18px;right:18px;background:var(--text);
  color:#fff;padding:13px 16px;border-radius:var(--r2);font-size:13.5px;font-weight:500;
  display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(8px);
  transition:all .25s;z-index:200;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast i{flex-shrink:0;font-size:16px;}
</style>
</head>
<body>
<div class="phone" id="app">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span class="st-time" id="clock">9:41</span>
    <div class="st-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></div>
  </div>

  <!-- SCREENS -->
  <div class="screens-wrap" id="sw"></div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav" id="bnav" style="display:none;">
    <button class="nav-t active" onclick="goTab('home',this)"><i class="ti ti-home"></i><span>Inicio</span></button>
    <button class="nav-t" onclick="goTab('progreso',this)"><i class="ti ti-chart-line"></i><span>Progreso</span></button>
    <button class="nav-t" onclick="goTab('videos',this)"><i class="ti ti-player-play"></i><span>Ejercicios</span></button>
    <button class="nav-t" onclick="goTab('chat',this)"><i class="ti ti-message-circle"></i><span>Victoria</span></button>
  </div>

  <!-- MODAL MEDIDAS -->
  <div class="modal-ov" id="modal-med" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal-sh">
      <div class="modal-hnd"></div>
      <div class="modal-tit">Registrar medidas de hoy</div>
      <div class="modal-bd">

async function loadMedidas(){
  if(!USER)return
  const p=PC[PROG]
  const {data}=await sb.from('medidas').select('*').eq('user_id',USER.id).order('created_at',{ascending:false}).limit(20)
  const list=document.getElementById('medidas-list')
  if(!list)return
  if(!data||data.length===0){list.innerHTML='<div class="empty-state"><i class="ti ti-ruler"></i><p>Sin medidas aún.<br>¡Empieza hoy!</p></div>';return}
  const lat=data[0], first=data[data.length-1]
  const rows=[
    ['ti-weight','Peso',lat.peso,first.peso,'kg'],
    ['ti-circle','Cintura',lat.cintura,first.cintura,'cm'],
    ['ti-circle-dotted','Cadera',lat.cadera,first.cadera,'cm'],
    ['ti-minus','Muslo',lat.muslo,first.muslo,'cm'],
  ]
  list.innerHTML=rows.filter(r=>r[2]).map(([ico,nam,val,ini,u])=>{
    const diff=val&&ini?(val-ini).toFixed(1):null
    const isGood=diff&&parseFloat(diff)<0
    return `<div class="measure-row">
      <div class="measure-ico" style="background:${p.al};color:${p.a};"><i class="ti ${ico}"></i></div>
      <span class="measure-name">${nam}</span>
      <div><div class="measure-val">${val} ${u}</div>${diff?`<div class="measure-delta ${isGood?'delta-pos':'delta-neg'}">${isGood?'↓':'↑'} ${Math.abs(diff)} ${u}</div>`:''}</div>
    </div>`
  }).join('')

  // Load photos
  const {data:fotos}=await sb.from('fotos_progreso').select('*').eq('user_id',USER.id).order('created_at',{ascending:true})
  if(fotos&&fotos.length>0){
    const grid=document.getElementById('photo-grid')
    if(!grid)return
    const u1=sb.storage.from('fotos-progreso').getPublicUrl(fotos[0].path).data.publicUrl
    const u2=sb.storage.from('fotos-progreso').getPublicUrl(fotos[fotos.length-1].path).data.publicUrl
    grid.innerHTML=`
      <div class="photo-slot"><img src="${u1}"><div class="photo-slot-week">Inicio</div><div class="photo-slot-lbl">Antes</div></div>
      <div class="photo-slot"><img src="${u2}"><div class="photo-slot-week">Hoy</div><div class="photo-slot-lbl">Ahora</div></div>`
  }
}

function previewFoto(inp){
  const f=inp.files[0]; if(!f)return
  const r=new FileReader()
  r.onload=e=>{document.getElementById('preview-img').src=e.target.result;document.getElementById('preview-wrap').style.display='block'}
  r.readAsDataURL(f)
}

async function guardarMedidas(){
  if(!USER)return toast('Debes estar logueada')
  const peso=parseFloat(document.getElementById('i-peso')?.value)||null
  const cin=parseFloat(document.getElementById('i-cintura')?.value)||null
  const cad=parseFloat(document.getElementById('i-cadera')?.value)||null
  const mus=parseFloat(document.getElementById('i-muslo')?.value)||null
  const foto=document.getElementById('i-foto')?.files?.[0]
  const btn=document.getElementById('btn-guardar')
  if(btn){btn.innerHTML='<i class="ti ti-loader-2"></i> Guardando…';btn.disabled=true}
  const {error}=await sb.from('medidas').insert({user_id:USER.id,peso,cintura:cin,cadera:cad,muslo:mus})
  if(error){toast('Error: '+error.message);if(btn){btn.innerHTML='<i class="ti ti-device-floppy"></i> Guardar medidas';btn.disabled=false};return}
  if(foto){
    const ext=foto.name.split('.').pop()
    const path=`${USER.id}/${Date.now()}.${ext}`
    const {error:ue}=await sb.storage.from('fotos-progreso').upload(path,foto)
    if(!ue)await sb.from('fotos_progreso').insert({user_id:USER.id,path})
  }
  document.getElementById('modal-med').classList.remove('open')
  if(btn){btn.innerHTML='<i class="ti ti-device-floppy"></i> Guardar medidas';btn.disabled=false}
  toast('Medidas guardadas. Victoria las verá ✓')
  setTimeout(loadMedidas,500)
}

function filterVids(cat,btn){
  document.querySelectorAll('.vf-btn').forEach(b=>b.classList.remove('active'))
  btn.classList.add('active'); loadVideos(cat)
}

async function openVid(id){
  const v=ALL_VIDEOS.find(x=>x.id===id); if(!v)return
  const {data:{publicUrl}}=sb.storage.from('videos-ejercicios').getPublicUrl(v.storage_path)
  document.getElementById('vm-title').textContent=v.titulo
  document.getElementById('vm-desc').textContent=v.descripcion||''
  const pl=document.getElementById('vm-player'); pl.src=publicUrl; pl.load()
  document.getElementById('modal-video').classList.add('open')
}

let chatSub=null
async function loadMsgs(){
  if(!USER)return
  const msgs=document.getElementById('msgs'); if(!msgs)return
  const {data:vic}=await sb.from('profiles').select('id').eq('es_victoria',true).single()
  const vicId=vic?.id
  const {data,error}=await sb.from('mensajes').select('*')
    .or(vicId?`and(de_id.eq.${USER.id},para_id.eq.${vicId}),and(de_id.eq.${vicId},para_id.eq.${USER.id})`:`de_id.eq.${USER.id}`)
    .order('created_at',{ascending:true}).limit(50)
  if(!data||data.length===0){
    msgs.innerHTML=`<div class="msg-row vic"><div class="msg-av2 vic">VC</div><div><div class="bub">Hola 👋 Bienvenida a Rekupera. ¡Cualquier duda me escribes!</div><div class="msg-t">Victoria</div></div></div>`
    return
  }
  const initials=(PROFILE?.nombre||'YO').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase()
  msgs.innerHTML=data.map(m=>{
    const mine=m.de_id===USER.id
    return `<div class="msg-row ${mine?'me':'vic'}"><div class="msg-av2 ${mine?'me':'vic'}">${mine?initials:'VC'}</div><div><div class="bub">${m.texto}</div><div class="msg-t">${time(m.created_at)}</div></div></div>`
  }).join('')
  msgs.scrollTop=msgs.scrollHeight
  if(chatSub)sb.removeChannel(chatSub)
  chatSub=sb.channel('chat-'+USER.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes'},pl=>{
    const m=pl.new; if(m.de_id!==USER.id&&m.para_id!==USER.id)return
    const mine=m.de_id===USER.id
    const d=document.createElement('div'); d.className='msg-row '+(mine?'me':'vic')
    d.innerHTML=`<div class="msg-av2 ${mine?'me':'vic'}">${mine?initials:'VC'}</div><div><div class="bub">${m.texto}</div><div class="msg-t">${time(m.created_at)}</div></div>`
    msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight
  }).subscribe()
}

async function sendMsg(){
  const inp=document.getElementById('chat-inp'); const txt=inp?.value?.trim()
  if(!txt||!USER)return; inp.value=''
  const {data:vic}=await sb.from('profiles').select('id').eq('es_victoria',true).single()
  if(!vic)return toast('Victoria no está configurada aún')
  await sb.from('mensajes').insert({de_id:USER.id,para_id:vic.id,texto:txt})
}

async function sendQ(txt){
  if(!USER)return
  const {data:vic}=await sb.from('profiles').select('id').eq('es_victoria',true).single()
  if(!vic)return toast('Error al enviar')
  await sb.from('mensajes').insert({de_id:USER.id,para_id:vic.id,texto:txt})
}

async function subirVideo(){
  const tit=document.getElementById('v-tit')?.value?.trim()
  const cat=document.getElementById('v-cat')?.value
  const niv=document.getElementById('v-niv')?.value
  const dur=document.getElementById('v-dur')?.value?.trim()
  const desc=document.getElementById('v-desc')?.value?.trim()
  const file=document.getElementById('v-file')?.files?.[0]
  if(!tit||!cat||!file)return toast('Completa título, programa y selecciona un video')
  const uprog=document.getElementById('v-uprog'), ubar=document.getElementById('v-ubar')
  if(uprog)uprog.style.display='block'; if(ubar)ubar.style.width='15%'
  const ext=file.name.split('.').pop(), path=`${cat}/${Date.now()}.${ext}`
  const {error:ue}=await sb.storage.from('videos-ejercicios').upload(path,file)
  if(ue){toast('Error al subir video: '+ue.message);return}
  if(ubar)ubar.style.width='80%'
  const {error:de}=await sb.from('videos').insert({titulo:tit,categoria:cat,duracion:dur,nivel:niv,descripcion:desc,storage_path:path})
  if(de){toast('Error al guardar: '+de.message);return}
  if(ubar)ubar.style.width='100%'
  setTimeout(()=>{if(uprog)uprog.style.display='none';if(ubar)ubar.style.width='0%'},1500)
  toast('¡Video subido exitosamente! ✓')
  document.getElementById('v-tit').value=''; document.getElementById('v-desc').value=''
  document.getElementById('v-fname').textContent=''
}

async function cerrarSesion(){
  await sb.auth.signOut(); USER=null; PROFILE=null
  document.getElementById('bnav').style.display='none'
  renderScreen('login')
}
